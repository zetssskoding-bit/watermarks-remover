<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Text Cleaner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f7;
            color: #18181b;
            min-height: 100vh;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 60px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            padding: 7px 13px;
            background: #e9e9ee;
            border-radius: 999px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(34px, 6vw, 58px);
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        .subtitle {
            max-width: 650px;
            margin: auto;
            color: #71717a;
            line-height: 1.7;
            font-size: 16px;
        }

        .tool {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 22px;
            padding: 24px;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.05);
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        .counter {
            font-size: 12px;
            color: #a1a1aa;
        }

        textarea {
            width: 100%;
            min-height: 240px;
            resize: vertical;

            padding: 18px;

            border:
                1px solid #d4d4d8;

            border-radius: 14px;

            outline: none;

            font-family: inherit;
            font-size: 15px;
            line-height: 1.7;

            transition: 0.2s;
        }

        textarea:focus {
            border-color: #18181b;
        }

        #output {
            background: #fafafa;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 18px 0 24px;
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .primary {
            flex: 1;
            background: #18181b;
            color: white;
        }

        .secondary {
            background: #ededf0;
            color: #18181b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-header {
            margin-top: 5px;
        }

        .stats {
            display: none;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 18px;
        }

        .stat {
            background: #f4f4f5;
            border-radius: 12px;
            padding: 14px;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 12px;
            color: #71717a;
            margin-top: 4px;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .success {
            background: #ecfdf3;
            color: #166534;
        }

        .error {
            background: #fef2f2;
            color: #991b1b;
        }

        .footer-note {
            text-align: center;
            color: #a1a1aa;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 650px) {
            .container {
                padding: 35px 0;
            }

            .tool {
                padding: 17px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            textarea {
                min-height: 200px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="badge">
            Unicode Text Cleaner
        </div>

        <h1>
            Clean Your Text.
        </h1>

        <p class="subtitle">
            Bersihkan invisible Unicode, zero-width characters,
            exotic spaces dan hidden formatting dari teks Anda.
        </p>

    </div>


    <div class="tool">

        <div class="label-row">

            <label for="input">
                Input Text
            </label>

            <span
                class="counter"
                id="counter"
            >
                0 karakter
            </span>

        </div>


        <textarea
            id="input"
            placeholder="Paste teks di sini..."
        ></textarea>


        <div class="buttons">

            <button
                class="primary"
                id="cleanButton"
                onclick="cleanText()"
            >
                Clean Text
            </button>

            <button
                class="secondary"
                onclick="clearText()"
            >
                Clear
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div
            class="stats"
            id="stats"
        >

            <div class="stat">

                <div
                    class="stat-number"
                    id="removed"
                >
                    0
                </div>

                <div class="stat-label">
                    Removed
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="replaced"
                >
                    0
                </div>

                <div class="stat-label">
                    Replaced
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="length"
                >
                    0
                </div>

                <div class="stat-label">
                    Output Characters
                </div>

            </div>

        </div>


        <div class="label-row result-header">

            <label for="output">
                Cleaned Text
            </label>

        </div>


        <textarea
            id="output"
            placeholder="Hasil akan muncul di sini..."
            readonly
        ></textarea>


        <div class="buttons">

            <button
                class="primary"
                onclick="copyResult()"
            >
                Copy Result
            </button>

        </div>

    </div>


    <div class="footer-note">
        Layer A Unicode cleaning • Text is processed automatically
    </div>

</div>


<script>

const input = document.getElementById("input");

input.addEventListener("input", () => {

    document.getElementById("counter").textContent =
        input.value.length.toLocaleString() + " karakter";

});


async function cleanText() {

    const text = input.value;

    const button =
        document.getElementById("cleanButton");

    const message =
        document.getElementById("message");


    if (!text) {

        showMessage(
            "Masukkan teks terlebih dahulu.",
            "error"
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Cleaning...";

    message.style.display = "none";


    try {

        const response = await fetch(
            "/api/clean",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text: text
                })
            }
        );


        const data =
            await response.json();


        if (!data.ok) {

            throw new Error(
                data.error ||
                "Gagal membersihkan text."
            );

        }


        document.getElementById("output").value =
            data.cleaned;


        document.getElementById("removed").textContent =
            data.stats.removed_count;


        document.getElementById("replaced").textContent =
            data.stats.replaced_count;


        document.getElementById("length").textContent =
            data.stats.output_length.toLocaleString();


        document.getElementById("stats").style.display =
            "grid";


        const total =
            data.stats.removed_count +
            data.stats.replaced_count;


        if (total > 0) {

            showMessage(
                `${total} karakter tersembunyi / abnormal berhasil diproses.`,
                "success"
            );

        } else {

            showMessage(
                "Tidak ditemukan karakter Layer A yang perlu dibersihkan.",
                "success"
            );

        }


    } catch (error) {

        showMessage(
            error.message,
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent = "Clean Text";

    }

}


async function copyResult() {

    const output =
        document.getElementById("output");

    if (!output.value) {

        showMessage(
            "Belum ada hasil untuk disalin.",
            "error"
        );

        return;

    }


    try {

        await navigator.clipboard.writeText(
            output.value
        );

        showMessage(
            "Hasil berhasil disalin.",
            "success"
        );

    } catch {

        output.select();

        document.execCommand("copy");

        showMessage(
            "Hasil berhasil disalin.",
            "success"
        );

    }

}


function clearText() {

    input.value = "";

    document.getElementById("output").value =
        "";

    document.getElementById("counter").textContent =
        "0 karakter";

    document.getElementById("stats").style.display =
        "none";

    document.getElementById("message").style.display =
        "none";

}


function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}

</script>

</body>
</html>
